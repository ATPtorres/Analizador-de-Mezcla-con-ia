services:
  api:
    build: ../services/api
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    volumes:
      - reports:/var/lib/mixai
    tmpfs:
      - /tmp:size=768m,mode=1777
    mem_limit: 1536m
    cpus: 2
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  reports:
